# Pre-commit configuration for BIZ4Africa Odoo projects
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3

repos:
  # Generic pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
    exclude: '\.pot?$'
  - id: end-of-file-fixer
    exclude: '\.pot?$'
  - id: check-yaml
  - id: check-added-large-files
    args: ['--maxkb=2048']
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: mixed-line-ending
    args: ['--fix=lf']
  - id: debug-statements

  # Python formatting with Ruff
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.1.9
  hooks:
      # Run the linter
  - id: ruff
    args: ['--fix', '--exit-non-zero-on-fix']
      # Run the formatter
  - id: ruff-format

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.11.0
  hooks:
  - id: pretty-format-yaml
    additional_dependencies:
    - setuptools<81
    args:
    - --autofix
    - --indent=2
    - --preserve-quotes

  # RST checks
- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
  - id: rst-backticks
    exclude: ^docs/DEVELOPMENT_STANDARD\.rst$
  - id: rst-directive-colons
  - id: rst-inline-touching-normal

  # Odoo-specific checks (OCA)
- repo: https://github.com/OCA/pylint-odoo
  rev: v9.0.3
  hooks:
  - id: pylint_odoo
    name: pylint with optional checks for Odoo
    args:
    - --rcfile=.pylintrc
    - --exit-zero
    additional_dependencies:
    - pylint>=2.17.0

  # Security checks
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.5
  hooks:
  - id: bandit
    args: ['-c', 'pyproject.toml']
    additional_dependencies: ['bandit[toml]', 'pbr']

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.38.0
  hooks:
  - id: markdownlint
    args: ['--fix']

# Exclude patterns
exclude: |
  (?x)^(
    \.git/.*|
    \.venv/.*|
    envs/.*|
    sources/.*|
    projects/.*|
    .*\.egg-info/.*|
    __pycache__/.*|
    \.pyc$
  )
